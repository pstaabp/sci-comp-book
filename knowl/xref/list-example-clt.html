<figure class="listing figure-like"><figcaption><span class="type">Listing</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">31.1<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>An example Command Line Tool<div class="autopermalink" aria-hidden="true" data-description="Listing 31.1: An example Command Line Tool"><a tabindex="-1" href="#list-example-clt" title="Copy heading and permalink for Listing 31.1: An example Command Line Tool" aria-label="Copy heading and permalink for Listing 31.1: An example Command Line Tool">🔗</a></div></figcaption><div class="listing__contents"><div class="code-box"><pre class="program clipboardable line-numbers"><code class="language-none">using ArgParse

function parse_commandline()
  s = ArgParseSettings()
  @add_arg_table s begin
    "--verbose", "-v"
      help = "show additional information"
      action = :store_true
    "--opt1", "-o"
      help = "option one is an integer"
      arg_type = Int
      default = 0
    "--opt2", "-s"
      help = "this is a string option"
      arg_type = String
      default = ""
    "arg1"
      help = "first positional argument"
      required = true
  end
  return parse_args(s)
end

function main()
  parsed_args = parse_commandline()
  println("Parsed args:")
  for (arg,val) in parsed_args
    println("  $arg  =&gt;  $val")
  end
end

main()
