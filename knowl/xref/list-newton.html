<figure class="listing figure-like"><figcaption><span class="type">Listing</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.7<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>Newton’s method with a stopping condition if it doesn’t converge<div class="autopermalink" aria-hidden="true" data-description="Listing 10.7: Newton’s method with a stopping condition if it doesn’t converge"><a tabindex="-1" href="#list-newton" title="Copy heading and permalink for Listing 10.7: Newton’s method with a stopping condition if it doesn’t converge" aria-label="Copy heading and permalink for Listing 10.7: Newton’s method with a stopping condition if it doesn’t converge">🔗</a></div></figcaption><div class="listing__contents"><div class="code-box"><pre class="program clipboardable line-numbers"><code class="language-none">function newton(f::Function, x0::Number)
  local steps = 0
  while true
    dx = f(x0)/ForwardDiff.derivative(f, x0)
    x0 -= dx
    steps +=1
    (abs(dx) &lt; 1e-6 || steps &gt;= 10) &amp;&amp; return x0
  end
end
